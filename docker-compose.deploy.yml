name: docflow-ai

# Versión "SOLO EJECUTAR": usa imágenes ya publicadas en el registro (no necesita el código fuente).
# Para una persona que solo quiere hacerlo funcionar:
#   1) instala Docker
#   2) descarga este fichero y crea un .env con GROQ_API_KEY y MSSQL_SA_PASSWORD
#   3) docker compose -f docker-compose.deploy.yml up -d
#   3b) define el certificado HTTPS con CERT_B64 y KEY_B64: certificado y clave en PEM codificados en base64 (una sola línea), como variables del stack
#   4) abre https://<nombre del servidor> (el certificado debe cubrir ese nombre)
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DocFlow_Dev123!}"
    volumes:
      - docflow-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: ghcr.io/eric270992/docflow-ai-api:latest
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      Database__Proveedor: "SqlServer"
      ConnectionStrings__SqlServer: "Server=db,1433;Database=DocFlowAI;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DocFlow_Dev123!};TrustServerCertificate=True;"
      Database__MigrateOnStartup: "true"
      # Proveedor LLM: "Groq" (nube, por defecto), "Nvidia" (nube, límite por petición no por token),
      # "EIO" (servidor de EIO) o "Local" (LM Studio/Ollama). Se elige en el .env.
      Llm__Proveedor: "${LLM_PROVIDER:-Groq}"
      # EIO: el modelo viene en appsettings.json de la imagen; la URL y la clave NO se versionan (repo público).
      Llm__Perfiles__EIO__BaseUrl: "${EIO_BASE_URL:-}"
      Llm__Perfiles__EIO__ApiKey: "${EIO_API_KEY:-}"
      # Vacía por defecto: si usas otro proveedor no necesitas clave de Groq (no da aviso al arrancar).
      Llm__Perfiles__Groq__ApiKey: "${GROQ_API_KEY:-}"
      # Groq deprecia modelos con cierta frecuencia (ver https://console.groq.com/docs/deprecations).
      # Si el modelo por defecto deja de existir, sobreescribe GROQ_MODEL en el .env sin esperar una imagen nueva.
      Llm__Perfiles__Groq__Model: "${GROQ_MODEL:-qwen/qwen3.6-27b}"
      # Nvidia build.nvidia.com: gratis sin tarjeta, límite de 40 peticiones/minuto (no por token como
      # Groq) — mejor opción si las imágenes de las facturas son grandes. Clave en build.nvidia.com.
      # OJO: el Free Endpoint solo admite 1 imagen por petición (vale para facturas de 1 página).
      Llm__Perfiles__Nvidia__ApiKey: "${NVIDIA_API_KEY:-}"
      Llm__Perfiles__Nvidia__Model: "${NVIDIA_MODEL:-nvidia/llama-3.1-nemotron-nano-vl-8b-v1}"
      # Para Local: URL del servidor. Si corre en el mismo PC que Docker, usa host.docker.internal.
      Llm__Perfiles__Local__BaseUrl: "${LLM_LOCAL_BASEURL:-http://host.docker.internal:1234/v1}"
      Llm__Perfiles__Local__Model: "${LLM_LOCAL_MODEL:-qwen/qwen2.5-vl-7b}"
      Storage__BasePath: "/data/documentos"
      # Prueba de grounding ("D'on surt cada dada"): desactivado por defecto. GROUNDING_HABILITADO=true en el .env lo activa.
      Grounding__Habilitado: "${GROUNDING_HABILITADO:-false}"
      # Documentació de l'API amb Scalar a https://<servidor>/api/scalar (JSON a /api/openapi/v1.json).
      # DOCS_HABILITADA=false al .env la desactiva. El prefix és el de la ruta /api/ de nginx.
      Documentacio__Habilitada: "${DOCS_HABILITADA:-true}"
      Documentacio__PrefixPublic: "/api"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # permite alcanzar un LLM local en el host (Linux)
    # Sin "ports": la API solo se alcanza a través de web/caddy. Si necesitas llamarla directa
    # para depurar, añade temporalmente:  ports: ["5255:8080"]
    volumes:
      - docflow-files:/data/documentos
      - docflow-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/eric270992/docflow-ai-web:latest
    # Sin "ports": solo es accesible desde el proxy HTTPS (caddy) por la red interna del stack.
    depends_on:
      - api

  # Proxy inverso HTTPS: termina el TLS con TU certificado y reenvía a "web" por HTTP interno.
  # Los ficheros del certificado los escribe "certs-init" en el volumen docflow-certs a partir de las variables
  # CERT_B64 y KEY_B64 (así no hay que subir nada al servidor ni al repositorio). Caddy los lee de ahí:
  #   server.crt  (o el nombre de CERT_FILE; certificado + cadena intermedia, formato PEM)
  #   server.key  (o el nombre de KEY_FILE; clave privada, formato PEM)
  # Para cambiar de certificado: sustituye los ficheros y reinicia el servicio caddy.
  certs-init:
    image: alpine:3
    restart: "no"
    environment:
      CERT_B64: "${CERT_B64:?define CERT_B64 (certificado PEM en base64)}"
      KEY_B64: "${KEY_B64:?define KEY_B64 (clave privada PEM en base64)}"
      CERT_FILE: "${CERT_FILE:-server.crt}"
      KEY_FILE: "${KEY_FILE:-server.key}"
    command:
      - sh
      - -c
      - |
        echo "$$CERT_B64" | base64 -d > "/certs/$$CERT_FILE" &&
        echo "$$KEY_B64" | base64 -d > "/certs/$$KEY_FILE" &&
        chmod 600 "/certs/$$KEY_FILE"
    volumes:
      - docflow-certs:/certs

  caddy:
    image: caddy:2
    ports:
      - "80:80"     # redirige a HTTPS
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - docflow-certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
      certs-init:
        condition: service_completed_successfully
    restart: unless-stopped

configs:
  caddyfile:
    content: |
      # Sin nombre de dominio: responde con el nombre con el que se acceda (p. ej. portainer01.eio.local),
      # siempre que el certificado lo cubra.
      :443 {
        tls /certs/${CERT_FILE:-server.crt} /certs/${KEY_FILE:-server.key}
        encode gzip
        reverse_proxy web:80
      }
      :80 {
        redir https://{host}{uri} permanent
      }

volumes:
  docflow-db:
  docflow-files:
  docflow-logs:
  docflow-certs:
  caddy-data:
  caddy-config:
